<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>concept-03-monogram - Primary Corporate Logo</title>
  <!-- Premium Warm Ivory Canvas -->
  <rect width="800" height="480" fill="#F9F8F5"/>
  <rect x="24" y="24" width="752" height="432" fill="none" stroke="#E2DED5" stroke-width="1" rx="8"/>
  
  <!-- Centered Stacked Presentation -->
  <g transform="translate(305, 90)">
    
    <g class="symbol-concept-03" transform="scale(0.9500)">
      <!-- 'A' Monolithic Apex & Diagonal Rafters -->
      <polygon points="30,76 90,24 110,24 170,76 148,76 100,42 52,76" fill="#C5A880"/>
      
      <!-- 'H' Left Monolithic Column -->
      <rect x="30" y="76" width="22" height="98" rx="1.5" fill="#121316"/>
      <!-- 'H' Right Monolithic Column -->
      <rect x="148" y="76" width="22" height="98" rx="1.5" fill="#121316"/>
      
      <!-- 'H' Crossbar (Left Wing) -->
      <rect x="52" y="96" width="30" height="18" fill="#121316"/>
      <!-- 'H' Crossbar (Right Wing) -->
      <rect x="118" y="96" width="30" height="18" fill="#121316"/>
      
      <!-- Central Hub Diamond Core -->
      <polygon points="100,84 120,105 100,126 80,105" fill="#C5A880"/>
      <!-- Inner Diamond Precision Aperture (Negative Space) -->
      <polygon points="100,94 110,105 100,116 90,105" fill="#F9F8F5"/>
    </g>
  
  </g>
  
  <g transform="translate(0, 325)">
    <text x="400" y="36" font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="#121316" text-anchor="middle">AFRISMME HUB</text>
    <text x="400" y="66" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="4.5" fill="#A88A62" text-anchor="middle">HOSPITALITY SUPPORT ECOSYSTEM</text>
    <text x="400" y="95" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#8C93A0" text-anchor="middle">STRATEGIC OPERATIONS  •  FACILITIES  •  TECHNOLOGY  •  PROCUREMENT</text>
  </g>
</svg>