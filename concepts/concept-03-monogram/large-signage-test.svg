<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <title>concept-03-monogram - Large Architectural Facade Signage Simulation</title>
  
