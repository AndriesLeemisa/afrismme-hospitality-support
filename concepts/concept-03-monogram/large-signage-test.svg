  <rect x="140" y="100" width="680" height="240" fill="#14171D" stroke="#2E3540" stroke-width="2" rx="12"/>
  
  <circle cx="160" cy="120" r="4" fill="#3A404D"/>
  <circle cx="800" cy="120" r="4" fill="#3A404D"/>
  <circle cx="160" cy="320" r="4" fill="#3A404D"/>
