<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <title>concept-01-ecosystem - Horizontal Corporate Lockup</title>
  
  <!-- Symbol (120x120 centered vertically at x=30, y=20) -->
  <g transform="translate(30, 20)">
    
    <g class="symbol-concept-01" transform="scale(0.6000)">
      <!-- Quadrant 01: Top-Right (Operations & Advisory) -->
      <path d="M 106 20 A 78 78 0 0 1 180 94 L 148 94 A 46 46 0 0 0 106 52 Z" fill="#C5A880"/>
      
      <!-- Quadrant 02: Bottom-Right (Facilities Management & FF&E) -->
      <path d="M 180 106 A 78 78 0 0 1 106 180 L 106 148 A 46 46 0 0 0 148 106 Z" fill="#121316"/>
      
      <!-- Quadrant 03: Bottom-Left (Supply Chain & Sourcing) -->
      <path d="M 94 180 A 78 78 0 0 1 20 106 L 52 106 A 46 46 0 0 0 94 148 Z" fill="#C5A880"/>
      
      <!-- Quadrant 04: Top-Left (Technology & Guest Systems) -->
      <path d="M 20 94 A 78 78 0 0 1 94 20 L 94 52 A 46 46 0 0 0 52 94 Z" fill="#121316"/>
      
      <!-- Central Hub Star: 4-Point Curved Diamond Compass Rose -->
      <path d="M 100 80 Q 100 100 120 100 Q 100 100 100 120 Q 100 100 80 100 Q 100 100 100 80 Z" fill="#C5A880"/>
    </g>
  
  </g>
  <!-- Divider -->
  <line x1="175" y1="36" x2="175" y2="124" stroke="#E2DED5" stroke-width="1.5"/>
  <!-- Wordmark -->
  <g transform="translate(200, 48)">
    <text x="0" y="34" font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="5" fill="#121316">AFRISMME HUB</text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#A88A62">HOSPITALITY SUPPORT ECOSYSTEM</text>
  </g>
</svg>