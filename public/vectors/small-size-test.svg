<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <title>concept-01-ecosystem - Small Size Scalability &amp; Reduction Test</title>
  <rect width="760" height="300" fill="#F9F8F5"/>
  <rect x="20" y="20" width="720" height="260" fill="none" stroke="#E2DED5" stroke-width="1" rx="8"/>
  
  <text x="40" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#121316">SCALABILITY &amp; REDUCTION LEGIBILITY AUDIT</text>
  <text x="40" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="#8C93A0">Verification of vector geometry retention across standard micro-breakpoints (64px, 48px, 32px, 24px, 16px)</text>
  
  <!-- 64px Test -->
  <g transform="translate(50, 110)">
    <rect width="64" height="64" fill="#121316" rx="10"/>
    <g transform="translate(4, 4)">
      
    <g class="symbol-concept-01" transform="scale(0.2800)">
      <!-- Quadrant 01: Top-Right (Operations & Advisory) -->
      <path d="M 106 20 A 78 78 0 0 1 180 94 L 148 94 A 46 46 0 0 0 106 52 Z" fill="#C5A880"/>
      
      <!-- Quadrant 02: Bottom-Right (Facilities Management & FF&E) -->
      <path d="M 180 106 A 78 78 0 0 1 106 180 L 106 148 A 46 46 0 0 0 148 106 Z" fill="#C5A880"/>
      
      <!-- Quadrant 03: Bottom-Left (Supply Chain & Sourcing) -->
      <path d="M 94 180 A 78 78 0 0 1 20 106 L 52 106 A 46 46 0 0 0 94 148 Z" fill="#C5A880"/>
      
      <!-- Quadrant 04: Top-Left (Technology & Guest Systems) -->
      <path d="M 20 94 A 78 78 0 0 1 94 20 L 94 52 A 46 46 0 0 0 52 94 Z" fill="#C5A880"/>
      
      <!-- Central Hub Star: 4-Point Curved Diamond Compass Rose -->
      <path d="M 100 80 Q 100 100 120 100 Q 100 100 100 120 Q 100 100 80 100 Q 100 100 100 80 Z" fill="#C5A880"/>
    </g>
  
    </g>
    <text x="32" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#121316" text-anchor="middle">64px</text>
    <text x="32" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8C93A0" text-anchor="middle">App Icon</text>
  </g>
  
  <!-- 48px Test -->
  <g transform="translate(170, 118)">
    <rect width="48" height="48" fill="#121316" rx="8"/>
    <g transform="translate(3, 3)">
      
    <g class="symbol-concept-01" transform="scale(0.2100)">
      <!-- Quadrant 01: Top-Right (Operations & Advisory) -->
      <path d="M 106 20 A 78 78 0 0 1 180 94 L 148 94 A 46 46 0 0 0 106 52 Z" fill="#C5A880"/>
      
      <!-- Quadrant 02: Bottom-Right (Facilities Management & FF&E) -->
      <path d="M 180 106 A 78 78 0 0 1 106 180 L 106 148 A 46 46 0 0 0 148 106 Z" fill="#C5A880"/>
      
      <!-- Quadrant 03: Bottom-Left (Supply Chain & Sourcing) -->
      <path d="M 94 180 A 78 78 0 0 1 20 106 L 52 106 A 46 46 0 0 0 94 148 Z" fill="#C5A880"/>
      
      <!-- Quadrant 04: Top-Left (Technology & Guest Systems) -->
      <path d="M 20 94 A 78 78 0 0 1 94 20 L 94 52 A 46 46 0 0 0 52 94 Z" fill="#C5A880"/>
      
      <!-- Central Hub Star: 4-Point Curved Diamond Compass Rose -->
      <path d="M 100 80 Q 100 100 120 100 Q 100 100 100 120 Q 100 100 80 100 Q 100 100 100 80 Z" fill="#C5A880"/>
    </g>
  
    </g>
    <text x="24" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#121316" text-anchor="middle">48px</text>
    <text x="24" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8C93A0" text-anchor="middle">Avatar</text>
  </g>
  
  <!-- 32px Test -->
  <g transform="translate(280, 126)">
    <rect width="32" height="32" fill="#121316" rx="6"/>
    <g transform="translate(2, 2)">
      
    <g class="symbol-concept-01" transform="scale(0.1400)">
      <!-- Quadrant 01: Top-Right (Operations & Advisory) -->
      <path d="M 106 20 A 78 78 0 0 1 180 94 L 148 94 A 46 46 0 0 0 106 52 Z" fill="#C5A880"/>
      
      <!-- Quadrant 02: Bottom-Right (Facilities Management & FF&E) -->
      <path d="M 180 106 A 78 78 0 0 1 106 180 L 106 148 A 46 46 0 0 0 148 106 Z" fill="#C5A880"/>
      
      <!-- Quadrant 03: Bottom-Left (Supply Chain & Sourcing) -->
      <path d="M 94 180 A 78 78 0 0 1 20 106 L 52 106 A 46 46 0 0 0 94 148 Z" fill="#C5A880"/>
      
      <!-- Quadrant 04: Top-Left (Technology & Guest Systems) -->
      <path d="M 20 94 A 78 78 0 0 1 94 20 L 94 52 A 46 46 0 0 0 52 94 Z" fill="#C5A880"/>
      
      <!-- Central Hub Star: 4-Point Curved Diamond Compass Rose -->
      <path d="M 100 80 Q 100 100 120 100 Q 100 100 100 120 Q 100 100 80 100 Q 100 100 100 80 Z" fill="#C5A880"/>
    </g>
  
    </g>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#121316" text-anchor="middle">32px</text>
    <text x="16" y="71" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8C93A0" text-anchor="middle">Nav Bar</text>
  </g>
  
  <!-- 24px Test -->
  <g transform="translate(370, 130)">
    <rect width="24" height="24" fill="#121316" rx="4"/>
    <g transform="translate(2, 2)">
      
    <g class="symbol-concept-01" transform="scale(0.1000)">
      <!-- Quadrant 01: Top-Right (Operations & Advisory) -->
      <path d="M 106 20 A 78 78 0 0 1 180 94 L 148 94 A 46 46 0 0 0 106 52 Z" fill="#C5A880"/>
      
      <!-- Quadrant 02: Bottom-Right (Facilities Management & FF&E) -->
      <path d="M 180 106 A 78 78 0 0 1 106 180 L 106 148 A 46 46 0 0 0 148 106 Z" fill="#C5A880"/>
      
      <!-- Quadrant 03: Bottom-Left (Supply Chain & Sourcing) -->
      <path d="M 94 180 A 78 78 0 0 1 20 106 L 52 106 A 46 46 0 0 0 94 148 Z" fill="#C5A880"/>
      
      <!-- Quadrant 04: Top-Left (Technology & Guest Systems) -->
      <path d="M 20 94 A 78 78 0 0 1 94 20 L 94 52 A 46 46 0 0 0 52 94 Z" fill="#C5A880"/>
      
      <!-- Central Hub Star: 4-Point Curved Diamond Compass Rose -->
      <path d="M 100 80 Q 100 100 120 100 Q 100 100 100 120 Q 100 100 80 100 Q 100 100 100 80 Z" fill="#C5A880"/>
    </g>
  
    </g>
    <text x="12" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#121316" text-anchor="middle">24px</text>
    <text x="12" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8C93A0" text-anchor="middle">UI Pin</text>
  </g>
  
  <!-- 16px Test -->
  <g transform="translate(450, 134)">
    <rect width="16" height="16" fill="#121316" rx="3"/>
    <g transform="translate(1, 1)">
      
    <g class="symbol-concept-01" transform="scale(0.0700)">
      <!-- Quadrant 01: Top-Right (Operations & Advisory) -->
      <path d="M 106 20 A 78 78 0 0 1 180 94 L 148 94 A 46 46 0 0 0 106 52 Z" fill="#C5A880"/>
      
      <!-- Quadrant 02: Bottom-Right (Facilities Management & FF&E) -->
      <path d="M 180 106 A 78 78 0 0 1 106 180 L 106 148 A 46 46 0 0 0 148 106 Z" fill="#C5A880"/>
      
      <!-- Quadrant 03: Bottom-Left (Supply Chain & Sourcing) -->
      <path d="M 94 180 A 78 78 0 0 1 20 106 L 52 106 A 46 46 0 0 0 94 148 Z" fill="#C5A880"/>
      
      <!-- Quadrant 04: Top-Left (Technology & Guest Systems) -->
      <path d="M 20 94 A 78 78 0 0 1 94 20 L 94 52 A 46 46 0 0 0 52 94 Z" fill="#C5A880"/>
      
      <!-- Central Hub Star: 4-Point Curved Diamond Compass Rose -->
      <path d="M 100 80 Q 100 100 120 100 Q 100 100 100 120 Q 100 100 80 100 Q 100 100 100 80 Z" fill="#C5A880"/>
    </g>
  
    </g>
    <text x="8" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#121316" text-anchor="middle">16px</text>
    <text x="8" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8C93A0" text-anchor="middle">Favicon</text>
  </g>
  
  <!-- Optical Performance Verification -->
  <g transform="translate(530, 110)">
    <rect width="180" height="120" fill="#121316" rx="8"/>
    <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#C5A880">REDUCTION RATING</text>
    <text x="20" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Optical Clarity: 100%</text>
    <text x="20" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#9CA3AF">Stroke Integrity: Sharp</text>
    <text x="20" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#9CA3AF">Negative Space: Open</text>
    <text x="20" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#9CA3AF">No Choking / Blurring</text>
  </g>
</svg>