<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="720" height="170">
  <title>Restaurants &amp; Hospitality Support - Horizontal Lockup</title>
  
  
  <!-- Master Symbol -->
  <g transform="translate(30, 22)">
    
    <g class="master-symbol-rhs" transform="scale(0.6300)">
      <!-- 1. Ground Foundation Plinth (Operational Support Base) -->
      <rect x="22" y="172" width="156" height="7" rx="2" fill="#121316"/>
      
      <!-- 2. Twin Monumental Support Pillars (Facilities & Operations) -->
      <rect x="34" y="52" width="24" height="120" rx="2" fill="#121316"/>
      <rect x="142" y="52" width="24" height="120" rx="2" fill="#121316"/>
      
      <!-- 3. Welcoming Hospitality Archway (Sanctuary Portal) -->
      <path d="M 64 172 L 64 106 A 36 36 0 0 1 136 106 L 136 172 L 118 172 L 118 112 A 18 18 0 0 0 82 112 L 82 172 Z" fill="#121316"/>
      
      <!-- 4. Warm Hearth Horizon Node (Welcoming Core) -->
      <circle cx="100" cy="140" r="6.5" fill="#121316"/>
      
      <!-- 5. Sheltering Cantilever Canopy (Grand Architectural Lintel) -->
      <polygon points="16,52 26,38 174,38 184,52" fill="#121316"/>
      
      <!-- 6. Apex Diamond Keystone Beacon (Hospitality Standard of Excellence) -->
      <polygon points="100,18 114,32 100,44 86,32" fill="#121316"/>
    </g>
  
  </g>
  
  <!-- Architectural Vertical Divider Line -->
  <line x1="180" y1="36" x2="180" y2="134" stroke="#E2DED5" stroke-width="1.5"/>
  
  <!-- Wordmark -->
  <g transform="translate(205, 52)">
    <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="4" fill="#121316">RESTAURANTS &amp; HOSPITALITY</text>
    <text x="0" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#A88A62">SUPPORT ECOSYSTEM</text>
    <text x="0" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" fill="#6B7280">FACILITIES  •  OPERATIONS  •  TECHNOLOGY  •  PROCUREMENT</text>
  </g>
</svg>