<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <title>Restaurants &amp; Hospitality Support - Scalability &amp; Reduction Test</title>
  <rect width="760" height="300" fill="#F9F8F5"/>
  <rect x="20" y="20" width="720" height="260" fill="none" stroke="#E2DED5" stroke-width="1" rx="8"/>
  
  <text x="40" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#121316">RESTAURANTS &amp; HOSPITALITY SUPPORT — SCALABILITY AUDIT</text>
  <text x="40" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="#8E99A8">Demonstrating zero stroke crowding across micro breakpoints (64px, 48px, 32px, 24px, 16px)</text>
  
  <!-- 64px Test -->
  <g transform="translate(50, 110)">
    <rect width="64" height="64" fill="#121316" rx="10"/>
    <g transform="translate(4, 4)">
      
    <g class="master-symbol-rhs" transform="scale(0.2800)">
      <!-- 1. Ground Foundation Plinth (Operational Support Base) -->
      <rect x="22" y="172" width="156" height="7" rx="2" fill="#C5A880"/>
      
      <!-- 2. Twin Monumental Support Pillars (Facilities & Operations) -->
      <rect x="34" y="52" width="24" height="120" rx="2" fill="#C5A880"/>
      <rect x="142" y="52" width="24" height="120" rx="2" fill="#C5A880"/>
      
      <!-- 3. Welcoming Hospitality Archway (Sanctuary Portal) -->
      <path d="M 64 172 L 64 106 A 36 36 0 0 1 136 106 L 136 172 L 118 172 L 118 112 A 18 18 0 0 0 82 112 L 82 172 Z" fill="#C5A880"/>
      
      <!-- 4. Warm Hearth Horizon Node (Welcoming Core) -->
      <circle cx="100" cy="140" r="6.5" fill="#C5A880"/>
      
      <!-- 5. Sheltering Cantilever Canopy (Grand Architectural Lintel) -->
      <polygon points="16,52 26,38 174,38 184,52" fill="#C5A880"/>
      
      <!-- 6. Apex Diamond Keystone Beacon (Hospitality Standard of Excellence) -->
      <polygon points="100,18 114,32 100,44 86,32" fill="#C5A880"/>
    </g>
  
    </g>
    <text x="32" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#121316" text-anchor="middle">64px</text>
    <text x="32" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8E99A8" text-anchor="middle">App Icon</text>
  </g>
  
