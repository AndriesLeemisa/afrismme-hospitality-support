<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500">
  <title>Restaurants &amp; Hospitality Support - Master Corporate Identity</title>
  
  <!-- Heavy Warm Ivory Canvas -->
  <rect width="840" height="500" fill="#F9F8F5"/>
  <rect x="24" y="24" width="792" height="452" fill="none" stroke="#E2DED5" stroke-width="1" rx="10"/>
  
  <!-- Centered Symbol (190x190 at x=325, y=85) -->
  <g transform="translate(325, 85)">
    
    <g class="master-symbol-rhs" transform="scale(0.9500)">
      <!-- 1. Ground Foundation Plinth (Operational Support Base) -->
      <rect x="22" y="172" width="156" height="7" rx="2" fill="#121316"/>
      
      <!-- 2. Twin Monumental Support Pillars (Facilities & Operations) -->
      <rect x="34" y="52" width="24" height="120" rx="2" fill="#121316"/>
      <rect x="142" y="52" width="24" height="120" rx="2" fill="#121316"/>
      
      <!-- 3. Welcoming Hospitality Archway (Sanctuary Portal) -->
      <path d="M 64 172 L 64 106 A 36 36 0 0 1 136 106 L 136 172 L 118 172 L 118 112 A 18 18 0 0 0 82 112 L 82 172 Z" fill="#1B3B2B"/>
      
      <!-- 4. Warm Hearth Horizon Node (Welcoming Core) -->
      <circle cx="100" cy="140" r="6.5" fill="#C5A880"/>
      
      <!-- 5. Sheltering Cantilever Canopy (Grand Architectural Lintel) -->
      <polygon points="16,52 26,38 174,38 184,52" fill="#C5A880"/>
      
      <!-- 6. Apex Diamond Keystone Beacon (Hospitality Standard of Excellence) -->
      <polygon points="100,18 114,32 100,44 86,32" fill="#C5A880"/>
    </g>
  
  </g>
  
  <!-- Corporate Typographic System -->
  <g transform="translate(0, 330)">
    <text x="420" y="34" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="32" font-weight="800" letter-spacing="5" fill="#121316" text-anchor="middle">RESTAURANTS &amp; HOSPITALITY</text>
    <text x="420" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" letter-spacing="6" fill="#A88A62" text-anchor="middle">SUPPORT ECOSYSTEM</text>
    <line x1="300" y1="82" x2="540" y2="82" stroke="#C5A880" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="420" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" letter-spacing="3" fill="#8E99A8" text-anchor="middle">STRATEGIC OPERATIONS  •  FACILITIES &amp; ACOUSTIC INTERIORS  •  PROCUREMENT</text>
  </g>
</svg>