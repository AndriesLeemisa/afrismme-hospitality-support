<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <title>Restaurants &amp; Hospitality Support - Large Architectural Entrance Signage</title>
  
  <!-- Dark Textured Architectural Granite Wall -->
  <rect width="960" height="460" fill="#0D0E11"/>
  
  <!-- Subtle Wall Grooves -->
  <line x1="0" y1="120" x2="960" y2="120" stroke="#1A1D24" stroke-width="1.5"/>
  <line x1="0" y1="340" x2="960" y2="340" stroke="#1A1D24" stroke-width="1.5"/>
  <line x1="320" y1="0" x2="320" y2="460" stroke="#1A1D24" stroke-width="1.5"/>
  <line x1="640" y1="0" x2="640" y2="460" stroke="#1A1D24" stroke-width="1.5"/>

  <!-- Brushed Metal Signboard Panel with Bronze Border -->
  <rect x="110" y="90" width="740" height="260" fill="#14171D" stroke="#2E3540" stroke-width="2" rx="12"/>
  <rect x="120" y="100" width="720" height="240" fill="none" stroke="#C5A880" stroke-width="1" stroke-opacity="0.3" rx="8"/>
  
  <!-- Precision Standoff Hardware -->
  <circle cx="135" cy="115" r="4.5" fill="#3D4554"/>
  <circle cx="825" cy="115" r="4.5" fill="#3D4554"/>
  <circle cx="135" cy="325" r="4.5" fill="#3D4554"/>
  <circle cx="825" cy="325" r="4.5" fill="#3D4554"/>
  
  <!-- Dimensional Cast Bronze Symbol (Shadow + Bronze) -->
  <g transform="translate(162, 137)">
    <g transform="translate(3, 4)" opacity="0.6">
      
    <g class="master-symbol-rhs" transform="scale(0.8250)">
      <!-- 1. Ground Foundation Plinth (Operational Support Base) -->
      <rect x="22" y="172" width="156" height="7" rx="2" fill="#121316"/>
      
      <!-- 2. Twin Monumental Support Pillars (Facilities & Operations) -->
      <rect x="34" y="52" width="24" height="120" rx="2" fill="#121316"/>
      <rect x="142" y="52" width="24" height="120" rx="2" fill="#121316"/>
      
      <!-- 3. Welcoming Hospitality Archway (Sanctuary Portal) -->
      <path d="M 64 172 L 64 106 A 36 36 0 0 1 136 106 L 136 172 L 118 172 L 118 112 A 18 18 0 0 0 82 112 L 82 172 Z" fill="#121316"/>
      
      <!-- 4. Warm Hearth Horizon Node (Welcoming Core) -->
      <circle cx="100" cy="140" r="6.5" fill="#121316"/>
      
      <!-- 5. Sheltering Cantilever Canopy (Grand Architectural Lintel) -->
      <polygon points="16,52 26,38 174,38 184,52" fill="#121316"/>
      
      <!-- 6. Apex Diamond Keystone Beacon (Hospitality Standard of Excellence) -->
      <polygon points="100,18 114,32 100,44 86,32" fill="#121316"/>
    </g>
  
    </g>
    
    <g class="master-symbol-rhs" transform="scale(0.8250)">
      <!-- 1. Ground Foundation Plinth (Operational Support Base) -->
      <rect x="22" y="172" width="156" height="7" rx="2" fill="#C5A880"/>
      
      <!-- 2. Twin Monumental Support Pillars (Facilities & Operations) -->
      <rect x="34" y="52" width="24" height="120" rx="2" fill="#C5A880"/>
      <rect x="142" y="52" width="24" height="120" rx="2" fill="#C5A880"/>
      
      <!-- 3. Welcoming Hospitality Archway (Sanctuary Portal) -->
      <path d="M 64 172 L 64 106 A 36 36 0 0 1 136 106 L 136 172 L 118 172 L 118 112 A 18 18 0 0 0 82 112 L 82 172 Z" fill="#C5A880"/>
      
      <!-- 4. Warm Hearth Horizon Node (Welcoming Core) -->
      <circle cx="100" cy="140" r="6.5" fill="#C5A880"/>
      
      <!-- 5. Sheltering Cantilever Canopy (Grand Architectural Lintel) -->
      <polygon points="16,52 26,38 174,38 184,52" fill="#C5A880"/>
      
      <!-- 6. Apex Diamond Keystone Beacon (Hospitality Standard of Excellence) -->
      <polygon points="100,18 114,32 100,44 86,32" fill="#C5A880"/>
    </g>
  
  </g>
  
  <!-- Typographic Signage in Brushed Champagne Gold -->
  <g transform="translate(365, 175)">
    <text x="0" y="38" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="32" font-weight="800" letter-spacing="4.5" fill="#C5A880">RESTAURANTS &amp; HOSPITALITY</text>
    <text x="0" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" letter-spacing="6" fill="#F9F8F5">SUPPORT ECOSYSTEM</text>
    <line x1="0" y1="90" x2="380" y2="90" stroke="#C5A880" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#8892A0">CENTRAL CORPORATE HEADQUARTERS &amp; CLIENT HUB</text>
  </g>
</svg>