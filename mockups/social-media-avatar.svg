<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <title>Restaurants &amp; Hospitality Support - Digital Avatar Suite</title>
  
  <rect width="1000" height="560" fill="#0C0E12"/>
  
  <text x="50" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#F9F8F5">DIGITAL AVATAR &amp; SOCIAL PROFILE SPECIFICATIONS</text>
  <text x="50" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="#8E99A8">Optimized with 20% Safe Padding for LinkedIn, X, Instagram, WhatsApp Business, and Mobile Platforms</text>

  <!-- CIRCULAR PROFILE -->
  <g transform="translate(80, 110)">
    <rect width="250" height="380" fill="#14171E" rx="10" stroke="#252B36" stroke-width="1.5"/>
    <text x="25" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C5A880">CIRCULAR PROFILE</text>
    <text x="25" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8E99A8">LinkedIn / Instagram / WhatsApp</text>
    
    <circle cx="125" cy="180" r="85" fill="#121316" stroke="#2E3540" stroke-width="2"/>
    <circle cx="125" cy="180" r="85" fill="none" stroke="#C5A880" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <g transform="translate(65, 120)">
      
    <g class="master-symbol-rhs" transform="scale(0.6000)">
      <!-- 1. Ground Foundation Plinth (Operational Support Base) -->
      <rect x="22" y="172" width="156" height="7" rx="2" fill="#C5A880"/>
      
      <!-- 2. Twin Monumental Support Pillars (Facilities & Operations) -->
      <rect x="34" y="52" width="24" height="120" rx="2" fill="#C5A880"/>
      <rect x="142" y="52" width="24" height="120" rx="2" fill="#C5A880"/>
      
