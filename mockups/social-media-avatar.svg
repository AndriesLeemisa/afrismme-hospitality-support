    <text x="25" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8E99A8">High-Contrast Warm Ivory Variant</text>
    
    <circle cx="125" cy="180" r="85" fill="#F9F8F5" stroke="#E2DED5" stroke-width="2"/>
    
