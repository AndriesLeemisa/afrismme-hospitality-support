      <path d="M 64 172 L 64 106 A 36 36 0 0 1 136 106 L 136 172 L 118 172 L 118 112 A 18 18 0 0 0 82 112 L 82 172 Z" fill="#C5A880"/>
      
      <!-- 4. Warm Hearth Horizon Node (Welcoming Core) -->
      <circle cx="100" cy="140" r="6.5" fill="#C5A880"/>
      
      <!-- 5. Sheltering Cantilever Canopy (Grand Architectural Lintel) -->
      <polygon points="16,52 26,38 174,38 184,52" fill="#C5A880"/>
      
      <!-- 6. Apex Diamond Keystone Beacon (Hospitality Standard of Excellence) -->
      <polygon points="100,18 114,32 100,44 86,32" fill="#C5A880"/>
    </g>
  
    </g>
    
    <text x="125" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#F9F8F5" text-anchor="middle">@HospitalitySupport</text>
    <text x="125" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8892A0" text-anchor="middle">Verified Corporate Account</text>
    
    <circle cx="125" cy="340" r="9" fill="#C5A880"/>
    <path d="M 121 340 L 124 343 L 129 337" stroke="#121316" stroke-width="2" fill="none"/>
  </g>

