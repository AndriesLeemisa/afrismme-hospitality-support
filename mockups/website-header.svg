      <rect x="22" y="172" width="156" height="7" rx="2" fill="#C5A880"/>
      
      <!-- 2. Twin Monumental Support Pillars (Facilities & Operations) -->
      <rect x="34" y="52" width="24" height="120" rx="2" fill="#C5A880"/>
      <rect x="142" y="52" width="24" height="120" rx="2" fill="#C5A880"/>
      
      <!-- 3. Welcoming Hospitality Archway (Sanctuary Portal) -->
      <path d="M 64 172 L 64 106 A 36 36 0 0 1 136 106 L 136 172 L 118 172 L 118 112 A 18 18 0 0 0 82 112 L 82 172 Z" fill="#C5A880"/>
      
      <!-- 4. Warm Hearth Horizon Node (Welcoming Core) -->
      <circle cx="100" cy="140" r="6.5" fill="#C5A880"/>
      
      <!-- 5. Sheltering Cantilever Canopy (Grand Architectural Lintel) -->
      <polygon points="16,52 26,38 174,38 184,52" fill="#C5A880"/>
      
      <!-- 6. Apex Diamond Keystone Beacon (Hospitality Standard of Excellence) -->
      <polygon points="100,18 114,32 100,44 86,32" fill="#C5A880"/>
    </g>
  
    </g>
    <g transform="translate(90, 68)">
      <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#F9F8F5">RESTAURANTS &amp; HOSPITALITY</text>
      <text x="0" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="2.5" fill="#C5A880">SUPPORT ECOSYSTEM</text>
    </g>
    
    <!-- Navigation Links -->
    <g transform="translate(430, 82)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#F9F8F5">Facilities Care</text>
      <text x="110" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#8E99A8">Interior Architecture</text>
      <text x="250" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#8E99A8">Equipment &amp; FF&amp;E</text>
      <text x="380" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#8E99A8">Rapid Support</text>
    </g>
    
    <rect x="800" y="58" width="95" height="36" rx="5" fill="#C5A880"/>
    <text x="847" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#121316" text-anchor="middle">CLIENT PORTAL</text>
    
    <!-- Hero Section -->
