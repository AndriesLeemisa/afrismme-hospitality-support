<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <title>Real-World Test: Executive Luxury Business Stationery</title>
  
  <rect width="1000" height="560" fill="#0C0E12"/>
  
  <text x="50" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#F9F8F5">EXECUTIVE BUSINESS STATIONERY (600GSM COTTON STOCK)</text>
  <text x="50" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="undefined">Muted Bronze Foil Stamping  •  Blind Debossed Charcoal Core  •  Warm Ivory Matte Heavy Card</text>

  <!-- CARD 1: FRONT (Minimalist Foil Crest & Wordmark) -->
  <g transform="translate(60, 110)">
    <!-- Card Drop Shadow -->
    <rect x="8" y="12" width="410" height="250" rx="8" fill="#000000" opacity="0.6"/>
    <!-- Deep Charcoal Card Base -->
    <rect width="410" height="250" rx="8" fill="#121316" stroke="#2A2F3A" stroke-width="1.5"/>
    <rect x="12" y="12" width="386" height="226" rx="5" fill="none" stroke="#2E3542" stroke-width="0.75"/>
    
    <!-- Centered Bronze Foil Symbol & Wordmark -->
    <g transform="translate(155, 45)">
      
    <g class="symbol-concept-02" transform="scale(0.5000)">
      <!-- Ground Foundation Plinth -->
      <rect x="24" y="172" width="152" height="6" rx="1.5" fill="#C5A880"/>
      
      <!-- Left Monumental Pillar -->
      <rect x="34" y="52" width="24" height="120" rx="1.5" fill="#C5A880"/>
      <!-- Right Monumental Pillar -->
      <rect x="142" y="52" width="24" height="120" rx="1.5" fill="#C5A880"/>
      
      <!-- Stepped Arch Portal (Sanctuary of Welcome) -->
      <path d="M 66 172 L 66 104 A 34 34 0 0 1 134 104 L 134 172 L 118 172 L 118 110 A 18 18 0 0 0 82 110 L 82 172 Z" fill="#C5A880"/>
      
      <!-- Welcoming Portal Horizon Beacon -->
      <circle cx="100" cy="138" r="6" fill="#C5A880"/>
      
      <!-- Cantilever Floating Canopy (The Grand Overhang) -->
      <polygon points="18,52 28,38 172,38 182,52" fill="#C5A880"/>
      
      <!-- Apex Golden Visionary Pediment -->
      <polygon points="100,20 115,34 85,34" fill="#C5A880"/>
    </g>
  
    </g>
    
    <text x="205" y="180" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#C5A880" text-anchor="middle">AFRISMME HUB</text>
    <text x="205" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" letter-spacing="3" fill="#F9F8F5" text-anchor="middle">HOSPITALITY SUPPORT ECOSYSTEM</text>
    
    <text x="205" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="undefined" text-anchor="middle">CARD FRONT (METALLIC BRONZE FOIL)</text>
  </g>

  <!-- CARD 2: BACK (Warm Ivory with Executive Typography) -->
  <g transform="translate(530, 110)">
    <!-- Card Drop Shadow -->
    <rect x="8" y="12" width="410" height="250" rx="8" fill="#000000" opacity="0.6"/>
    <!-- Warm Ivory Card Base -->
    <rect width="410" height="250" rx="8" fill="#F9F8F5" stroke="#E2DED5" stroke-width="1.5"/>
    
    <!-- Top-Right Micro Symbol in Bronze -->
    <g transform="translate(340, 24)">
      
    <g class="symbol-concept-02" transform="scale(0.2100)">
      <!-- Ground Foundation Plinth -->
      <rect x="24" y="172" width="152" height="6" rx="1.5" fill="#C5A880"/>
      
      <!-- Left Monumental Pillar -->
      <rect x="34" y="52" width="24" height="120" rx="1.5" fill="#C5A880"/>
      <!-- Right Monumental Pillar -->
      <rect x="142" y="52" width="24" height="120" rx="1.5" fill="#C5A880"/>
      
      <!-- Stepped Arch Portal (Sanctuary of Welcome) -->
      <path d="M 66 172 L 66 104 A 34 34 0 0 1 134 104 L 134 172 L 118 172 L 118 110 A 18 18 0 0 0 82 110 L 82 172 Z" fill="#C5A880"/>
      
      <!-- Welcoming Portal Horizon Beacon -->
      <circle cx="100" cy="138" r="6" fill="#C5A880"/>
      
      <!-- Cantilever Floating Canopy (The Grand Overhang) -->
      <polygon points="18,52 28,38 172,38 182,52" fill="#C5A880"/>
      
      <!-- Apex Golden Visionary Pediment -->
      <polygon points="100,20 115,34 85,34" fill="#C5A880"/>
    </g>
  
    </g>
    
    <!-- Executive Contact Details -->
    <g transform="translate(36, 45)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#121316">DR. LINDIWE NDLOVU</text>
      <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" letter-spacing="2" fill="#A88A62">MANAGING DIRECTOR  •  ECOSYSTEM PARTNERSHIPS</text>
      
      <line x1="0" y1="58" x2="270" y2="58" stroke="#E2DED5" stroke-width="1"/>
      
      <text x="0" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#121316">T:  +27 (0) 11 894 2000</text>
      <text x="0" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#121316">M:  +27 (0) 82 555 0192</text>
      <text x="0" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#121316">E:  executive@afrismmehub.com</text>
      <text x="0" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#121316">W:  www.afrismmehub.com</text>
      <text x="0" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="1" fill="undefined">SANDTON GATE TOWER  •  JOHANNESBURG</text>
    </g>
    
    <!-- Micro QR / Security Seal Block -->
    <rect x="340" y="180" width="36" height="36" fill="#121316" rx="3"/>
    <rect x="345" y="185" width="26" height="26" fill="#F9F8F5" rx="2"/>
    <rect x="349" y="189" width="18" height="18" fill="#121316"/>

    <text x="205" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="undefined" text-anchor="middle">CARD BACK (LETTERPRESS PRINT)</text>
  </g>
</svg>