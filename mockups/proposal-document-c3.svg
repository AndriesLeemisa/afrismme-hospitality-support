    <rect x="18" y="0" width="4" height="420" fill="#0D0E12"/>
    
    <!-- Top Confidentiality Header -->
    <text x="45" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.5" fill="#C5A880">CONFIDENTIAL  •  EXECUTIVE BRIEF</text>
    <line x1="45" y1="55" x2="330" y2="55" stroke="#252B38" stroke-width="1"/>
    
    <!-- Primary Center Emblem in Foil Bronze -->
    <g transform="translate(130, 95)">
      
    <g class="symbol-concept-03" transform="scale(0.6000)">
      <!-- 'A' Monolithic Apex & Diagonal Rafters -->
      <polygon points="30,76 90,24 110,24 170,76 148,76 100,42 52,76" fill="#C5A880"/>
      
      <!-- 'H' Left Monolithic Column -->
      <rect x="30" y="76" width="22" height="98" rx="1.5" fill="#C5A880"/>
      <!-- 'H' Right Monolithic Column -->
      <rect x="148" y="76" width="22" height="98" rx="1.5" fill="#C5A880"/>
      
      <!-- 'H' Crossbar (Left Wing) -->
      <rect x="52" y="96" width="30" height="18" fill="#C5A880"/>
      <!-- 'H' Crossbar (Right Wing) -->
      <rect x="118" y="96" width="30" height="18" fill="#C5A880"/>
      
      <!-- Central Hub Diamond Core -->
      <polygon points="100,84 120,105 100,126 80,105" fill="#C5A880"/>
      <!-- Inner Diamond Precision Aperture (Negative Space) -->
      <polygon points="100,94 110,105 100,116 90,105" fill="#F9F8F5"/>
    </g>
  
    </g>
    
    <!-- Wordmark & Document Title -->
    <g transform="translate(45, 255)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="20" font-weight="800" letter-spacing="3" fill="#F9F8F5">AFRISMME HUB</text>
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#C5A880">HOSPITALITY SUPPORT ECOSYSTEM</text>
      
      <line x1="0" y1="35" x2="285" y2="35" stroke="#C5A880" stroke-width="1.5"/>
      
      <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#F9F8F5">STRATEGIC FACILITIES INTEGRATION</text>
      <text x="0" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#9CA3AF">&amp; GUEST ECOSYSTEM MASTER PLAN</text>
      
      <text x="0" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#6B7280">PREPARED FOR: RADISSON BLU &amp; MARRIOTT RESORT GROUP</text>
      <text x="0" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#6B7280">DATE: OCTOBER 2026  •  DOC REF: AH-HSP-2026-V4</text>
    </g>
  </g>

  <!-- LETTERHEAD INTERNAL PAGE SAMPLE -->
