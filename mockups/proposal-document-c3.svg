      <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#121316">LINDIWE NDLOVU</text>
      <text x="0" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="undefined">GROUP MANAGING DIRECTOR</text>
