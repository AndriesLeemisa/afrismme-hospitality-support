<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <title>Real-World Test: Executive Proposal Document &amp; Dossier</title>
  
  <rect width="1000" height="560" fill="#0C0E12"/>
  
  <text x="50" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#F9F8F5">EXECUTIVE PROPOSAL DOSSIER &amp; CONTRACT COVER</text>
  <text x="50" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="undefined">A4 Executive Master Proposal  •  Deep Charcoal &amp; Bronze Hardcover Presentation</text>

  <!-- PROPOSAL COVER (A4 Presentation Folder) -->
  <g transform="translate(80, 100)">
