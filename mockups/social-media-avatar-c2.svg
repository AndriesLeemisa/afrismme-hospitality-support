<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <title>Real-World Test: Social Media Avatar &amp; Digital Icon Suite</title>
  
  <rect width="1000" height="560" fill="#0C0E12"/>
  
  <text x="50" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#F9F8F5">DIGITAL AVATAR &amp; SOCIAL PROFILE SPECIFICATIONS</text>
  <text x="50" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="undefined">Optimized with 20% Safe Padding for LinkedIn, X, Instagram, WhatsApp Business, and iOS/Android</text>

  <!-- AVATAR 1: Circular Avatar (e.g. LinkedIn / Instagram 400x400) -->
  <g transform="translate(80, 110)">
    <rect width="250" height="380" fill="#14171E" rx="10" stroke="#252B36" stroke-width="1.5"/>
    <text x="25" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C5A880">CIRCULAR PROFILE</text>
    <text x="25" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="undefined">LinkedIn / Instagram / WhatsApp</text>
    
    <!-- Circular container -->
    <circle cx="125" cy="180" r="85" fill="#121316" stroke="#2E3542" stroke-width="2"/>
    <circle cx="125" cy="180" r="85" fill="none" stroke="#C5A880" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Scaled Symbol with exact 25% safe padding -->
    <g transform="translate(65, 120)">
      
    <g class="symbol-concept-02" transform="scale(0.6000)">
      <!-- Ground Foundation Plinth -->
      <rect x="24" y="172" width="152" height="6" rx="1.5" fill="#C5A880"/>
      
      <!-- Left Monumental Pillar -->
      <rect x="34" y="52" width="24" height="120" rx="1.5" fill="#C5A880"/>
      <!-- Right Monumental Pillar -->
      <rect x="142" y="52" width="24" height="120" rx="1.5" fill="#C5A880"/>
      
      <!-- Stepped Arch Portal (Sanctuary of Welcome) -->
      <path d="M 66 172 L 66 104 A 34 34 0 0 1 134 104 L 134 172 L 118 172 L 118 110 A 18 18 0 0 0 82 110 L 82 172 Z" fill="#C5A880"/>
      
      <!-- Welcoming Portal Horizon Beacon -->
      <circle cx="100" cy="138" r="6" fill="#C5A880"/>
      
      <!-- Cantilever Floating Canopy (The Grand Overhang) -->
      <polygon points="18,52 28,38 172,38 182,52" fill="#C5A880"/>
      
      <!-- Apex Golden Visionary Pediment -->
      <polygon points="100,20 115,34 85,34" fill="#C5A880"/>
    </g>
  
    </g>
    
    <text x="125" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#F9F8F5" text-anchor="middle">@AfriSMMEHub</text>
    <text x="125" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8892A0" text-anchor="middle">Corporate Verified Badge</text>
    
    <!-- Verified Badge Icon -->
    <circle cx="125" cy="340" r="9" fill="#C5A880"/>
    <path d="M 121 340 L 124 343 L 129 337" stroke="#121316" stroke-width="2" fill="none"/>
  </g>

  <!-- AVATAR 2: Rounded Squircle Avatar (e.g. Apple App Store / Android Adaptive) -->
  <g transform="translate(375, 110)">
    <rect width="250" height="380" fill="#14171E" rx="10" stroke="#252B36" stroke-width="1.5"/>
    <text x="25" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C5A880">SQUIRCLE APP ICON</text>
    <text x="25" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="undefined">iOS / Android Ecosystem App</text>
    
    <!-- Squircle container -->
    <rect x="40" y="95" width="170" height="170" rx="38" fill="#121316" stroke="#2E3542" stroke-width="2"/>
    
    <g transform="translate(65, 120)">
      
    <g class="symbol-concept-02" transform="scale(0.6000)">
      <!-- Ground Foundation Plinth -->
      <rect x="24" y="172" width="152" height="6" rx="1.5" fill="#121316"/>
      
      <!-- Left Monumental Pillar -->
      <rect x="34" y="52" width="24" height="120" rx="1.5" fill="#121316"/>
      <!-- Right Monumental Pillar -->
      <rect x="142" y="52" width="24" height="120" rx="1.5" fill="#121316"/>
      
      <!-- Stepped Arch Portal (Sanctuary of Welcome) -->
      <path d="M 66 172 L 66 104 A 34 34 0 0 1 134 104 L 134 172 L 118 172 L 118 110 A 18 18 0 0 0 82 110 L 82 172 Z" fill="#1B3B2B"/>
      
      <!-- Welcoming Portal Horizon Beacon -->
      <circle cx="100" cy="138" r="6" fill="#C5A880"/>
      
      <!-- Cantilever Floating Canopy (The Grand Overhang) -->
      <polygon points="18,52 28,38 172,38 182,52" fill="#C5A880"/>
      
      <!-- Apex Golden Visionary Pediment -->
      <polygon points="100,20 115,34 85,34" fill="#C5A880"/>
    </g>
  
    </g>
    
    <text x="125" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#F9F8F5" text-anchor="middle">AfriSMME Hub</text>
    <text x="125" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8892A0" text-anchor="middle">Enterprise Portal 2.0</text>
  </g>

  <!-- AVATAR 3: Monochrome Inverted Avatar (Light Background Context) -->
  <g transform="translate(670, 110)">
    <rect width="250" height="380" fill="#14171E" rx="10" stroke="#252B36" stroke-width="1.5"/>
    <text x="25" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#C5A880">INVERTED LIGHT PROFILE</text>
    <text x="25" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="undefined">High-Contrast Warm Ivory Variant</text>
    
    <circle cx="125" cy="180" r="85" fill="#F9F8F5" stroke="#E2DED5" stroke-width="2"/>
    
    <g transform="translate(65, 120)">
      
    <g class="symbol-concept-02" transform="scale(0.6000)">
      <!-- Ground Foundation Plinth -->
      <rect x="24" y="172" width="152" height="6" rx="1.5" fill="#121316"/>
      
      <!-- Left Monumental Pillar -->
      <rect x="34" y="52" width="24" height="120" rx="1.5" fill="#121316"/>
      <!-- Right Monumental Pillar -->
      <rect x="142" y="52" width="24" height="120" rx="1.5" fill="#121316"/>
      
      <!-- Stepped Arch Portal (Sanctuary of Welcome) -->
      <path d="M 66 172 L 66 104 A 34 34 0 0 1 134 104 L 134 172 L 118 172 L 118 110 A 18 18 0 0 0 82 110 L 82 172 Z" fill="#121316"/>
      
      <!-- Welcoming Portal Horizon Beacon -->
      <circle cx="100" cy="138" r="6" fill="#121316"/>
      
      <!-- Cantilever Floating Canopy (The Grand Overhang) -->
      <polygon points="18,52 28,38 172,38 182,52" fill="#121316"/>
      
      <!-- Apex Golden Visionary Pediment -->
      <polygon points="100,20 115,34 85,34" fill="#121316"/>
    </g>
  
    </g>
    
    <text x="125" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#F9F8F5" text-anchor="middle">Black Monochrome</text>
    <text x="125" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8892A0" text-anchor="middle">100% Solid Ink Density</text>
  </g>
</svg>